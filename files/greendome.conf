<VirtualHost *:80>
    ServerName greendome.com
    ServerAlias www.greendome.com
    ServerAdmin admin@greendome.com
    
    DocumentRoot /var/www/greendome-ticketing/public
    
    <Directory /var/www/greendome-ticketing/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Deny access to sensitive directories
    <DirectoryMatch "^/var/www/greendome-ticketing/(config|includes|database|logs)">
        Require all denied
    </DirectoryMatch>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/greendome_error.log
    CustomLog ${APACHE_LOG_DIR}/greendome_access.log combined
    
    # Security Headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>
    
    # PHP Settings
    <IfModule mod_php7.c>
        php_value upload_max_filesize 20M
        php_value post_max_size 25M
        php_value max_execution_time 300
        php_value max_input_time 300
        php_flag display_errors off
        php_flag log_errors on
    </IfModule>
</VirtualHost>

